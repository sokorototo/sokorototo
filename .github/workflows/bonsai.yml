name: Generate Git Bonsai
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  generate-bonsai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: StevenBtw/gitbonsai@v0.5.2
        with:
          output-dir: assets
          legend: right
      - name: Commit if it changed
        env:
          FILES: >-
            ${{ steps.bonsai.outputs.light }}
            ${{ steps.bonsai.outputs.dark }}
            ${{ steps.bonsai.outputs.snapshot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES   # unquoted on purpose; breaks if paths contain spaces
          git diff --cached --quiet || git commit -m "Grow bonsai"
          git pull --rebase && git push
